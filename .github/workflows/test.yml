name: Frontend CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/**

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # 1. Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

     
      - name: Install dependencies
        run: npm ci

      
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build